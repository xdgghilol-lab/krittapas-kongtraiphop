<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 Book Tier Ranking</title>

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}


/* =========================
   TOP MENU
========================= */

.top-menu {
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 30px;
    padding: 0 15px;

    min-height: 48px;
}

.top-menu a {
    color: #374151;
    text-decoration: none;

    font-size: 14px;
    padding: 15px 4px;

    position: relative;
    transition: 0.2s;
}

.top-menu a:hover {
    color: #2563eb;
}

.top-menu a.active-menu {
    color: #2563eb;
}

.top-menu a.active-menu::after {
    content: "";

    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;
    background: #2563eb;
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 35px 15px;
    background: #0f172a;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: #cbd5e1;
}


/* =========================
   NAVIGATION
========================= */

.nav {
    display: flex;
    justify-content: center;

    gap: 10px;
    padding: 20px;

    flex-wrap: wrap;
}

.nav button {
    border: none;

    padding: 12px 22px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;
    font-weight: bold;
}

.nav .active {
    background: #22c55e;
    color: white;
}


/* =========================
   PAGE
========================= */

.page {
    display: none;

    width: 95%;
    max-width: 1200px;

    margin: auto;
}

.page.active-page {
    display: block;
}


/* =====================================================
   RESULT PAGE
===================================================== */

.result-summary {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 10px;

    margin: 20px 0;
}

.summary-box {
    background: #1f2937;

    border-radius: 10px;

    padding: 15px;

    text-align: center;
}

.summary-number {
    font-size: 28px;

    font-weight: bold;
}

.summary-label {
    color: #cbd5e1;

    font-size: 13px;

    margin-top: 5px;
}


/* =========================
   RESULT BOARD
========================= */

.result-board {
    background: #0b1220;

    border-radius: 14px;

    overflow: hidden;

    border: 2px solid #374151;

    margin-top: 20px;
}


/* =========================
   RESULT TIER
========================= */

.result-tier {
    display: flex;

    min-height: 135px;

    border-bottom: 2px solid #374151;
}

.result-tier:last-child {
    border-bottom: none;
}


/* =========================
   RESULT TIER NAME
========================= */

.result-tier-name {
    width: 100px;
    min-width: 100px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 45px;

    font-weight: bold;

    color: #111;
}


/* =========================
   RESULT BOOK AREA
========================= */

.result-books {
    flex: 1;

    display: flex;

    flex-wrap: wrap;

    align-content: flex-start;

    align-items: flex-start;

    gap: 10px;

    padding: 10px;

    min-width: 0;
}


/* =========================
   RESULT BOOK
========================= */

.result-book {
    width: 78px;
    height: 105px;

    border-radius: 7px;

    overflow: hidden;

    position: relative;

    background: #1f2937;

    box-shadow:
        0 4px 10px rgba(0,0,0,.5);

    transition:
        transform .15s;
}

.result-book:hover {
    transform: translateY(-4px);
}

.result-book img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================
   VOTE COUNT
========================= */

.result-book-count {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    background:
        rgba(0,0,0,.78);

    color: white;

    text-align: center;

    font-size: 12px;

    padding: 4px 2px;
}


/* =========================
   EMPTY
========================= */

.result-empty {
    display: flex;

    align-items: center;

    min-height: 100px;

    color: #64748b;

    font-size: 14px;
}


/* =====================================================
   TIER MAKER
===================================================== */

.tier-maker {
    margin-top: 20px;
}


/* =========================
   TIER
========================= */

.tier {
    display: flex;

    min-height: 130px;

    margin-bottom: 10px;

    border-radius: 8px;

    overflow: hidden;

    background: #1f2937;

    border: 2px solid #374151;
}


/* =========================
   TIER NAME
========================= */

.tier-name {
    width: 110px;
    min-width: 110px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 42px;

    font-weight: bold;

    color: #111;

    cursor: pointer;

    user-select: none;
}

.tier-name:hover {
    filter: brightness(1.08);
}


/* =========================
   TIER COLORS
========================= */

.S {
    background: #ff5252;
}

.A {
    background: #ff914d;
}

.B {
    background: #ffd84d;
}

.C {
    background: #72d572;
}

.D {
    background: #64b5f6;
}

.E {
    background: #b388ff;
}


/* =========================
   DROP ZONE
========================= */

.drop-zone {
    flex: 1;

    padding: 8px;

    display: flex;

    flex-wrap: wrap;

    align-content: flex-start;

    gap: 8px;

    min-width: 0;

    background: #1f2937;

    transition:
        background .15s;
}

.drop-zone.drag-over {
    background: #334155;
}


/* =========================
   BOOK
========================= */

.image-item {
    width: 85px;
    height: 110px;

    border-radius: 7px;

    overflow: hidden;

    cursor: grab;

    box-shadow:
        0 4px 10px rgba(0,0,0,.45);

    flex-shrink: 0;

    user-select: none;

    transition:
        transform .12s,
        opacity .12s;
}

.image-item:hover {
    transform: translateY(-2px);
}

.image-item:active {
    cursor: grabbing;
}

.image-item.dragging {
    opacity: .4;
}

.image-item img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    pointer-events: none;
}


/* =========================
   IMAGE POOL
========================= */

.pool {
    background: #1f2937;

    padding: 18px;

    border-radius: 10px;

    margin-top: 18px;
}

.pool h3 {
    margin-top: 0;
}

#imagePool {
    min-height: 130px;

    border: 2px dashed #64748b;

    border-radius: 8px;

    padding: 10px;

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    align-content: flex-start;
}

#imagePool.drag-over {
    background: #334155;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin: 15px 0;
}

.toolbar button {
    border: none;

    padding: 10px 14px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    background: #374151;

    color: white;
}

.toolbar button:hover {
    background: #4b5563;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin: 25px 0 50px;

    flex-wrap: wrap;
}

button {
    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;
}

button:hover {
    opacity: .9;
}

.submit {
    background: #22c55e;

    color: white;
}

.reset {
    background: #ef4444;

    color: white;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    header {
        padding: 30px 15px;

    header h1 {
        font-size: 32px;
    }

    }

    .tier-name {
        width: 90px;

        font-size: 36px;
    }

    .image-item {
        width: 75px;
        height: 98px;
    }

    .result-tier {
        min-height: 115px;
    }

    .result-tier-name {
        width: 90px;
        min-width: 90px;

        font-size: 36px;
    }

    .result-book {
        width: 68px;
        height: 91px;
    }

}


@media (max-width: 600px) {

        font-size: 14px;

        overflow-x: hidden;
    }


    /* TOP MENU */

    .top-menu {
        justify-content: flex-start;

        overflow-x: auto;

        white-space: nowrap;

        gap: 22px;

        padding: 0 12px;

        -webkit-overflow-scrolling: touch;
    }

    .top-menu a {
        font-size: 13px;

        padding: 14px 2px;

        flex-shrink: 0;
    }

    header {

    }

    header h1 {
        font-size: 26px;

        line-height: 1.3;
    }

    header p {
        font-size: 14px;

        line-height: 1.5;
    }


    /* NAV */

    .nav {
        padding: 12px;

        gap: 8px;
    }

    .nav button {
        flex: 1;

        min-width: 140px;

        padding: 11px 12px;

        font-size: 14px;
    }


    /* PAGE */

    .page {
        width: 95%;
    }


    /* TIER */

    .tier {
        min-height: 95px;

        margin-bottom: 8px;

        border-radius: 7px;
    }

    .tier-name {
        width: 55px;

        min-width: 55px;

        font-size: 27px;
    }

    .drop-zone {
        padding: 5px;

        gap: 5px;
    }


    /* BOOK */

    .image-item {
        width: 58px;

        height: 77px;

        border-radius: 5px;
    }


    /* POOL */

    .pool {
        padding: 12px;

        border-radius: 10px;
    }

    #imagePool {
        min-height: 105px;

        padding: 7px;

        gap: 5px;
    }


    /* TOOLBAR */

    .toolbar {
        gap: 6px;
    }

    .toolbar button {
        flex: 1;

        min-width: 120px;

        font-size: 13px;

        padding: 10px 8px;
    }


    /* BUTTONS */

    .buttons {
        flex-direction: column;

        gap: 8px;
    }

    .buttons button {
        width: 100%;
    }


    /* RESULT SUMMARY */

    .result-summary {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 7px;
    }

    .summary-box {
        padding: 11px;
    }

    .summary-number {
        font-size: 22px;
    }


    /* RESULT BOARD */

    .result-tier {
        min-height: 95px;
    }

    .result-tier-name {
        width: 55px;

        min-width: 55px;

        font-size: 27px;
    }

    .result-books {
        padding: 5px;

        gap: 5px;
    }

    .result-book {
        width: 55px;

        height: 73px;

        border-radius: 5px;
    }

    .result-book-count {
        font-size: 9px;

        padding: 2px;
    }

}


@media (max-width: 380px) {

    header h1 {
        font-size: 23px;
    }

    .nav button {
        min-width: 100%;
    }

    .tier-name {
        width: 48px;

        min-width: 48px;

        font-size: 23px;
    }

    .image-item {
        width: 52px;

        height: 69px;
    }

    .drop-zone {
        gap: 4px;

        padding: 4px;
    }

    .result-tier-name {
        width: 48px;

        min-width: 48px;

        font-size: 23px;
    }

    .result-book {
        width: 50px;

        height: 67px;
    }

}

</style>

<script>


/* =====================================================
   SETTINGS
===================================================== */

const bookCount = 10;

let selectedTier = null;


/* =====================================================
   CREATE BOOKS
===================================================== */

function createBooks() {

    const pool =
        document.getElementById(
            "imagePool"
        );


    pool.innerHTML = "";


    for (
        let i = 1;
        i <= bookCount;
        i++
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "image-item";


        item.id =
            "image" + i;


        item.draggable =
            true;


        item.innerHTML = `

            <img
                src="${i}.png"
                alt="หนังสือ ${i}">

        `;


        item.addEventListener(
            "dragstart",
            dragstartHandler
        );


        item.addEventListener(
            "dragend",
            dragendHandler
        );


        pool.appendChild(
            item
        );

    }

}


/* =====================================================
   DRAG START
===================================================== */

function dragstartHandler(event) {

    event.dataTransfer.effectAllowed =
        "move";


    event.dataTransfer.setData(
        "text/plain",
        event.currentTarget.id
    );


    event.currentTarget.classList.add(
        "dragging"
    );

}


/* =====================================================
   DRAG END
===================================================== */

function dragendHandler(event) {

    event.currentTarget.classList.remove(
        "dragging"
    );


    document
        .querySelectorAll(
            ".drag-over"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "drag-over"
                );

            }
        );

}


/* =====================================================
   DRAG OVER
===================================================== */

document.addEventListener(
    "dragover",
    function(event) {

        const zone =
            event.target.closest(
                ".drop-zone, #imagePool"
            );


        if (!zone)
            return;


        event.preventDefault();

    }
);


/* =====================================================
   DRAG ENTER
===================================================== */

document.addEventListener(
    "dragenter",
    function(event) {

        const zone =
            event.target.closest(
                ".drop-zone, #imagePool"
            );


        if (!zone)
            return;


        zone.classList.add(
            "drag-over"
        );

    }
);


/* =====================================================
   DRAG LEAVE
===================================================== */

document.addEventListener(
    "dragleave",
    function(event) {

        const zone =
            event.target.closest(
                ".drop-zone, #imagePool"
            );


        if (!zone)
            return;


        if (
            !zone.contains(
                event.relatedTarget
            )
        ) {

            zone.classList.remove(
                "drag-over"
            );

        }

    }
);


/* =====================================================
   DROP
===================================================== */

document.addEventListener(
    "drop",
    function(event) {

        const zone =
            event.target.closest(
                ".drop-zone, #imagePool"
            );


        if (!zone)
            return;


        event.preventDefault();


        zone.classList.remove(
            "drag-over"
        );


        const id =
            event.dataTransfer.getData(
                "text/plain"
            );


        const image =
            document.getElementById(
                id
            );


        if (!image)
            return;


        /*
            ถ้าวางบนหนังสือ
            จะจัดตำแหน่งก่อน/หลัง
        */

        const targetBook =
            event.target.closest(
                ".image-item"
            );


        if (
            targetBook &&
            targetBook !== image &&
            targetBook.parentElement === zone
        ) {

            const rect =
                targetBook.getBoundingClientRect();


            const middle =
                rect.left +
                rect.width / 2;


            if (
                event.clientX <
                middle
            ) {

                zone.insertBefore(
                    image,
                    targetBook
                );

            } else {

                zone.insertBefore(
                    image,
                    targetBook.nextSibling
                );

            }

        } else {

            zone.appendChild(
                image
            );

        }

    }
);


/* =====================================================
   PAGE SWITCH
===================================================== */

function showPage(page) {

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "active-page"
                );

            }
        );


    document
        .getElementById(page)
        .classList.add(
            "active-page"
        );


    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    if (
        page === "results"
    ) {

        document
            .getElementById(
                "resultButton"
            )
            .classList.add(
                "active"
            );

    } else {

        document
            .getElementById(
                "rankingButton"
            )
            .classList.add(
                "active"
            );

    }

}


/* =====================================================
   SELECT TIER
===================================================== */

function selectTier(element) {

    document
        .querySelectorAll(
            ".tier-name"
        )
        .forEach(
            name => {

                name.style.outline =
                    "none";

            }
        );


    element.style.outline =
        "4px solid white";


    selectedTier =
        element.closest(
            ".tier"
        );

}


/* =====================================================
   ADD TIER
===================================================== */

function addTier() {

    const maker =
        document.getElementById(
            "tierMaker"
        );


    const tier =
        document.createElement(
            "div"
        );


    tier.className =
        "tier";


    const number =
        maker.querySelectorAll(
            ".tier"
        ).length + 1;


    tier.dataset.tier =
        "custom" + number;


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "tier-name E";


    name.textContent =
        "NEW";


    name.onclick =
        function() {

            selectTier(this);

        };


    const zone =
        document.createElement(
            "div"
        );


    zone.className =
        "drop-zone";


    tier.appendChild(
        name
    );


    tier.appendChild(
        zone
    );


    maker.appendChild(
        tier
    );


    selectTier(
        name
    );

}


/* =====================================================
   RENAME TIER
===================================================== */

function renameSelectedTier() {

    if (!selectedTier) {

        alert(
            "⚠️ กรุณาคลิกชื่อ Tier ที่ต้องการแก้ก่อน"
        );

        return;

    }


    const nameElement =
        selectedTier.querySelector(
            ".tier-name"
        );


    const newName =
        prompt(
            "ใส่ชื่อ Tier ใหม่:",
            nameElement.textContent
        );


    if (
        newName !== null &&
        newName.trim() !== ""
    ) {

        nameElement.textContent =
            newName.trim();

    }

}


/* =====================================================
   CHANGE COLOR
===================================================== */

function changeSelectedColor() {

    if (!selectedTier) {

        alert(
            "⚠️ กรุณาเลือก Tier ก่อน"
        );

        return;

    }


    const color =
        prompt(
            "ใส่สี HEX เช่น #ff5252",
            "#ff5252"
        );


    if (
        color &&
        /^#[0-9A-F]{6}$/i.test(
            color
        )
    ) {

        selectedTier
            .querySelector(
                ".tier-name"
            )
            .style.background =
            color;

    } else if (color) {

        alert(
            "❌ รูปแบบสีไม่ถูกต้อง"
        );

    }

}


/* =====================================================
   DELETE TIER
===================================================== */

function deleteSelectedTier() {

    if (!selectedTier) {

        alert(
            "⚠️ กรุณาเลือก Tier ก่อน"
        );

        return;

    }


    const confirmDelete =
        confirm(
            "ต้องการลบ Tier นี้หรือไม่?\nหนังสือใน Tier จะถูกส่งกลับไปที่หนังสือทั้งหมด"
        );


    if (!confirmDelete)
        return;


    const pool =
        document.getElementById(
            "imagePool"
        );


    selectedTier
        .querySelectorAll(
            ".image-item"
        )
        .forEach(
            image => {

                pool.appendChild(
                    image
                );

            }
        );


    selectedTier.remove();


    selectedTier = null;

}


/* =====================================================
   RESET
===================================================== */

function resetRanking() {

    const pool =
        document.getElementById(
            "imagePool"
        );


    document
        .querySelectorAll(
            ".drop-zone .image-item"
        )
        .forEach(
            image => {

                pool.appendChild(
                    image
                );

            }
        );


    selectedTier = null;


    document
        .querySelectorAll(
            ".tier-name"
        )
        .forEach(
            name => {

                name.style.outline =
                    "none";

            }
        );


    alert(
        "🔄 รีเซ็ตการจัดอันดับแล้ว"
    );

}


/* =====================================================
   SUBMIT RANKING
===================================================== */

function submitRanking() {

    const tiers =
        document.querySelectorAll(
            "#tierMaker .tier"
        );


    let ranking = {};

    let total = 0;


    tiers.forEach(
        (tier, index) => {

            const name =
                tier
                    .querySelector(
                        ".tier-name"
                    )
                    .textContent
                    .trim();


            const books =
                tier.querySelectorAll(
                    ".image-item"
                );


            books.forEach(
                (book, position) => {

                    ranking[
                        book.id
                    ] = {

                        tier:
                            name,

                        position:
                            position,

                        tierIndex:
                            index

                    };


                    total++;

                }
            );

        }
    );


    /* ต้องครบ 10 เล่ม */

    if (
        total !== bookCount
    ) {

        alert(
            "⚠️ กรุณาจัดอันดับให้ครบทั้ง 10 เล่มก่อนส่ง"
        );

        return;

    }


    let allRankings =
        JSON.parse(
            localStorage.getItem(
                "allBookRankings"
            ) || "[]"
        );


    allRankings.push(
        ranking
    );


    localStorage.setItem(
        "allBookRankings",
        JSON.stringify(
            allRankings
        )
    );


    alert(
        "✅ บันทึกการจัดอันดับเรียบร้อย!"
    );


    displayResults();


    showPage(
        "results"
    );

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults() {

    const container =
        document.getElementById(
            "resultsContainer"
        );


    container.innerHTML = "";


    const allRankings =
        JSON.parse(
            localStorage.getItem(
                "allBookRankings"
            ) || "[]"
        );


    /* =========================
       NO DATA
    ========================= */

    if (
        allRankings.length === 0
    ) {

        container.innerHTML = `

            <div class="result-card">

                <h3>
                    📊 ยังไม่มีผลการจัดอันดับ
                </h3>

                <p>
                    เป็นคนแรกที่มาจัดอันดับหนังสือ!
                </p>

            </div>

        `;

        return;

    }


    /* =========================
       BOOK DATA
    ========================= */

    const books = {};


    for (
        let i = 1;
        i <= bookCount;
        i++
    ) {

        books[
            "image" + i
        ] = {

            id:
                "image" + i,

            image:
                i + ".png",

            votes: {}

        };

    }


    /* =========================
       COUNT VOTES
    ========================= */

    allRankings.forEach(
        ranking => {

            Object.keys(
                ranking
            ).forEach(
                bookId => {

                    const data =
                        ranking[
                            bookId
                        ];


                    if (
                        !books[bookId]
                    )
                        return;


                    const tier =
                        typeof data === "string"
                            ? data
                            : data.tier;


                    if (
                        !books[
                            bookId
                        ].votes[tier]
                    ) {

                        books[
                            bookId
                        ].votes[tier] = 0;

                    }


                    books[
                        bookId
                    ].votes[tier]++;

                }
            );

        }
    );


    /* =========================
       FIND BEST TIER
    ========================= */

    const tierBooks = {

        S: [],
        A: [],
        B: [],
        C: [],
        D: []

    };


    Object.keys(
        books
    ).forEach(
        bookId => {

            const book =
                books[bookId];


            const votes =
                book.votes;


            let bestTier = null;

            let bestVotes = 0;


            Object.keys(
                votes
            ).forEach(
                tier => {

                    if (
                        votes[tier] >
                        bestVotes
                    ) {

                        bestVotes =
                            votes[tier];

                        bestTier =
                            tier;

                    }

                }
            );


            /*
                ถ้าไม่มีข้อมูล
                ไม่ต้องแสดง
            */

            if (!bestTier)
                return;


            if (
                !tierBooks[bestTier]
            ) {

                tierBooks[
                    bestTier
                ] = [];

            }


            tierBooks[
                bestTier
            ].push({

                ...book,

                bestVotes:
                    bestVotes

            });

        }
    );


    /* =========================
       SUMMARY
    ========================= */

    const summary =
        document.createElement(
            "div"
        );


    summary.className =
        "result-summary";


    const summaryTiers =
        [
            "S",
            "A",
            "B",
            "C",
            "D"
        ];


    summaryTiers.forEach(
        tier => {

            const count =
                tierBooks[tier]
                    ? tierBooks[tier].length
                    : 0;


            summary.innerHTML += `

                <div class="summary-box">

                    <div class="summary-number">

                        ${count}

                    </div>

                    <div class="summary-label">

                        หนังสือ Tier ${tier}

                    </div>

                </div>

            `;

        }
    );


    container.appendChild(
        summary
    );


    /* =========================
       BOARD
    ========================= */

    const board =
        document.createElement(
            "div"
        );


    board.className =
        "result-board";


    const colors = {

        S:
            "#ff5252",

        A:
            "#ff914d",

        B:
            "#ffd84d",

        C:
            "#72d572",

        D:
            "#64b5f6"

    };


    summaryTiers.forEach(
        tier => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "result-tier";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "result-tier-name";


            name.textContent =
                tier;


            name.style.background =
                colors[tier];


            const booksArea =
                document.createElement(
                    "div"
                );


            booksArea.className =
                "result-books";


            const list =
                tierBooks[tier] || [];


            /* =========================
               BOOKS
            ========================= */

            list.forEach(
                book => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "result-book";


                    item.title =
                        `หนังสือ ${book.id.replace(
                            "image",
                            ""
                        )} - ${book.bestVotes} คนโหวต`;


                    item.innerHTML = `

                        <img
                            src="${book.image}"
                            alt="หนังสือ">


                        <div
                            class="result-book-count">

                            ${book.bestVotes} คน

                        </div>

                    `;


                    booksArea.appendChild(
                        item
                    );

                }
            );


            if (
                list.length === 0
            ) {

                booksArea.innerHTML = `

                    <div class="result-empty">

                        ยังไม่มีหนังสือใน Tier นี้

                    </div>

                `;

            }


            row.appendChild(
                name
            );


            row.appendChild(
                booksArea
            );


            board.appendChild(
                row
            );

        }
    );


    container.appendChild(
        board
    );


    /* =========================
       INFO
    ========================= */

    const info =
        document.createElement(
            "p"
        );


    info.style.color =
        "#94a3b8";


    info.style.margin =
        "15px 0 40px";


    info.innerHTML = `

        👥 ผู้จัดอันดับทั้งหมด:
        <strong>
            ${allRankings.length}
        </strong>
        คน

        <br>

        📚 หนังสือทั้งหมด:
        <strong>
            ${bookCount}
        </strong>
        เล่ม

        <br>

        💡 แต่ละเล่มจะอยู่ใน Tier
        ที่ได้รับคะแนนโหวตมากที่สุด

    `;


    container.appendChild(
        info
    );

}


/* =====================================================
   START
===================================================== */

createBooks();

displayResults();


</script>
